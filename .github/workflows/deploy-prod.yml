name: Deploy Frontend Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Load production config
        run: |
          echo "VITE_API_BASE_URL=$(aws ssm get-parameter \
            --name '/prod/chokokane/client/api-base-url' \
            --query 'Parameter.Value' \
            --output text)" >> "$GITHUB_ENV"
          TURNSTILE_SITE_KEY=$(aws ssm get-parameter \
            --name '/prod/chokokane/client/turnstile-site-key' \
            --query 'Parameter.Value' \
            --output text)
          if [ -z "$TURNSTILE_SITE_KEY" ] || [ "$TURNSTILE_SITE_KEY" = "None" ] || [ "$TURNSTILE_SITE_KEY" = "1x00000000000000000000AA" ]; then
            echo "A production Turnstile Site Key is required."
            exit 1
          fi
          echo "VITE_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY" >> "$GITHUB_ENV"

      - name: Build production
        run: yarn build:prod

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://chokokane-client --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2DYIXRUXLPL04 --paths "/*"
